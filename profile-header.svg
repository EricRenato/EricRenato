<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <style>
      .dark-bg { fill: #0d1117; }
      .light-bg { fill: #ffffff; }
      .text-main { fill: #c9a84c; }
      .text-sub-dark { fill: #e0e0e0; }
      .text-sub-light { fill: #333333; }
      .accent-line { stroke: #c9a84c; }
      @media (prefers-color-scheme: dark) {
        .bg { fill: #0d1117; }
        .text-sub { fill: #e0e0e0; }
      }
      @media (prefers-color-scheme: light) {
        .bg { fill: #ffffff; }
        .text-sub { fill: #333333; }
      }
    </style>
  </defs>
  
  <!-- Background with gradient effect -->
  <defs>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f6f8fa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Accent decoration top-left -->
  <circle cx="50" cy="30" r="15" fill="#c9a84c" opacity="0.3"/>
  <circle cx="750" cy="170" r="20" fill="#c9a84c" opacity="0.2"/>
  
  <!-- Main Title -->
  <text x="40" y="60" font-size="48" font-weight="900" class="text-main" font-family="Bebas Neue, Arial, sans-serif" letter-spacing="2">
    ERIC RENATO
  </text>
  
  <!-- Subtitle -->
  <text x="40" y="100" font-size="20" class="text-sub" font-family="Syne, Arial, sans-serif" font-weight="500">
    Data Analyst • Financial Systems • Business Intelligence
  </text>
  
  <!-- Description -->
  <text x="40" y="130" font-size="14" class="text-sub" font-family="Arial, sans-serif" opacity="0.8">
    15+ years transforming data into strategic decisions
  </text>
  
  <!-- Tech Stack Badges -->
  <g>
    <!-- Python -->
    <rect x="40" y="150" width="65" height="28" fill="#3776ab" rx="4" opacity="0.85"/>
    <text x="72" y="170" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="Arial">Python</text>
    
    <!-- SQL -->
    <rect x="115" y="150" width="65" height="28" fill="#cc2927" rx="4" opacity="0.85"/>
    <text x="147" y="170" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="Arial">SQL</text>
    
    <!-- JavaScript -->
    <rect x="190" y="150" width="75" height="28" fill="#f7df1e" rx="4" opacity="0.85"/>
    <text x="227" y="170" font-size="11" fill="#000000" font-weight="bold" text-anchor="middle" font-family="Arial">JavaScript</text>
    
    <!-- Analytics -->
    <rect x="275" y="150" width="80" height="28" fill="#1f77b4" rx="4" opacity="0.85"/>
    <text x="315" y="170" font-size="11" fill="#ffffff" font-weight="bold" text-anchor="middle" font-family="Arial">Analytics</text>
  </g>
  
  <!-- Decorative bottom line -->
  <line x1="0" y1="195" x2="800" y2="195" stroke="#c9a84c" stroke-width="3" opacity="0.7"/>
</svg>